name: Nightly Evaluation

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Run Crisis Detection Evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic keyword crisis evaluation
        run: node scripts/eval-keyword.ts

      - name: Run LLM crisis evaluation (if ANTHROPIC_API_KEY secret configured)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/eval-llm.ts

      - name: Generate evaluation comparison report
        if: always()
        run: node scripts/eval-report.ts

      - name: Upload evaluation results and reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval/results/
          retention-days: 30
